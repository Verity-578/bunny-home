[build]
  command = "npm install && cd bunny-home-frontend && npm install && npm run build && cd .. && node netlify/build-function.mjs"
  publish = "bunny-home-frontend/dist"

[functions]
  directory = "netlify-build"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
